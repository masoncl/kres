[package]
name = "kres-repl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kres-core = { workspace = true }
kres-agents = { workspace = true }
kres-llm = { workspace = true }
kres-mcp = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
rustyline = "14"
libc = "0.2"
# TUI scaffolding. `unstable-rendered-line-info` exposes
# Paragraph::line_count(), which we need so scrollback follows the
# same wrapped-row model ratatui actually renders.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
